name: CI

on:
  push:
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Unit tests (container)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Service image (default target, includes runtime stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
