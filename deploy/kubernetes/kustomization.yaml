apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# single source of truth for the image reference. `make build` produces
# polaris-profiler:latest; pin newTag to a release for real clusters.
images:
  - name: polaris-profiler
    newTag: latest

labels:
  - pairs:
      app.kubernetes.io/name: polaris-profiler
      app.kubernetes.io/part-of: polaris
    includeSelectors: false
